version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

  #0. Redis
  redis:
    image: redis:alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    restart: always

  # 1. Database với Healthcheck
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: Zikph@m0907
      MYSQL_DATABASE: cinema_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pZikph@m0907",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Eureka Discovery Server
  discovery-server:
    build: ./discovery-service
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  # 3. User Service
  user-service:
    build: ./user-service
    container_name: user-service
    hostname: user-service
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 4. Booking Service
  booking-service:
    build: ./booking-service
    container_name: booking-service
    hostname: booking-service
    ports:
      - "8084:8084"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 5. Cinema Service
  cinema-service:
    build: ./cinema-service
    container_name: cinema-service
    hostname: cinema-service
    ports:
      - "8083:8083"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 6. Movie Service
  movie-service:
    build: ./movie-service
    container_name: movie-service
    hostname: movie-service
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 7. Showtime Service
  showtime-service:
    build: ./showtime-service
    container_name: showtime-service
    hostname: showtime-service
    ports:
      - "8085:8085"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 8. Pay Service
  pay-service:
    build: ./pay-service
    container_name: pay-service
    hostname: payment-service
    ports:
      - "8086:8086"
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

  # 9. API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - user-service
      - booking-service
      - cinema-service
      - movie-service
      - showtime-service
      - pay-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql_data:
